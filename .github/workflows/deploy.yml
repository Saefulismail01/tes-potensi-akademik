name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 31.97.188.69
          port: 22
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/paps
            git pull origin main
            npm ci
            npm run build
            pkill -f "node server.cjs" || true
            nohup node server.cjs > /tmp/paps-server.log 2>&1 &
